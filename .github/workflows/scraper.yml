name: Daily SBI Forex Scraper

on:
  schedule:
    # 5:00 AM UTC = 10:30 AM IST (Monday to Friday)
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber pandas

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sbi_tt_rates.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update SBI TT Rates"
          git push
